<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>一般纳税人资格查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
            transition: all 0.3s ease;
        }

        /* 浅色模式 */
        :root {
            --body-bg: #f8f9fc;
            --card-bg: #ffffff;
            --text: #333;
            --theme-color: #2563eb;
            --border: #ddd;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        /* 深色模式 */
        [data-theme="dark"] {
            --body-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --theme-color: #3b82f6;
            --border: #444;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        body {
            background: var(--body-bg);
            color: var(--text);
            min-height: 100vh;
            padding: 60px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            width: 1000px;
            max-width: 100%;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #themeBtn {
            position: absolute;
            top: 20px;
            right: 24px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--theme-color);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: var(--theme-color);
            margin-bottom: 30px;
            font-size: 26px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        #cityInput {
            width: 340px;
            height: 48px;
            padding: 0 16px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--card-bg);
            color: var(--text);
        }

        #searchBtn {
            height: 48px;
            padding: 0 26px;
            background: var(--theme-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            font-size: 22px;
            min-height: 30px;
            line-height: 1.8;
            color: var(--theme-color);
        }

        #result a {
            color: var(--theme-color);
            text-decoration: none;
            font-weight: bold;
            margin-left: 8px;
        }

        #result a:hover {
            text-decoration: underline;
        }

        .tip {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        /* 输入联想下拉 */
        .input-wrap {
            position: relative;
        }

        .suggestions {
            position: absolute;
            top: 54px;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            max-height: 260px;
            overflow-y: auto;
            z-index: 20;
            text-align: left;
            display: none;
        }

        .suggestions.show {
            display: block;
        }

        .sug-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 15px;
            color: var(--text);
        }

        .sug-item:hover,
        .sug-item.active {
            background: var(--theme-color);
            color: #fff;
        }

        /* 最近查询历史 */
        .history {
            margin-bottom: 22px;
            min-height: 10px;
        }

        .history-title {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }

        .chip {
            display: inline-block;
            margin: 4px 6px 4px 0;
            padding: 6px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text);
        }

        .chip:hover {
            border-color: var(--theme-color);
            color: var(--theme-color);
        }

        /* 窄屏适配 */
        @media (max-width: 520px) {
            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }
            #cityInput,
            #searchBtn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

// 主题切换
const themeBtn = document.getElementById('themeBtn');
const html = document.documentElement;
// 读取上次的主题偏好（localStorage 记忆，刷新不丢失）
if (localStorage.getItem('theme') === 'dark') {
    html.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '☀️';
}
themeBtn.onclick = function () {
    if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        this.textContent = '🌙';
        localStorage.setItem('theme', 'light');
    } else {
        html.setAttribute('data-theme', 'dark');
        this.textContent = '☀️';
        localStorage.setItem('theme', 'dark');
    }
};

// 查询功能
const searchBtn = document.getElementById('searchBtn');
const cityInput = document.getElementById('cityInput');
const result = document.getElementById('result');
const suggestionsEl = document.getElementById('suggestions');
const historyEl = document.getElementById('history');

// 计划单列市：使用独立查询入口（优先于所属省份入口）
const directCityLinks = {
    "大连": provinceLinks["大连市"]
};

// 常见简称/别名 → 标准城市名（用于容错输入）
const cityAlias = {
    "沪": "上海", "申": "上海",
    "穗": "广州", "羊城": "广州",
    "蓉": "成都", "锦官城": "成都",
    "杭": "杭州", "甬": "宁波",
    "京": "北京", "燕京": "北京",
    "津": "天津", "津门": "天津",
    "渝": "重庆",
    "鹏城": "深圳", "深": "深圳"
};

// 归一化：大小写不敏感 + 别名转换 + 去除「市/省/自治区」等后缀
function normalizeCity(input) {
    let c = (input || "").trim().toLowerCase();
    if (!c) return null;
    const aliasLower = {};
    for (const k in cityAlias) aliasLower[k.toLowerCase()] = cityAlias[k];
    if (aliasLower[c]) c = aliasLower[c].toLowerCase();
    const stripped = c.replace(/(市|省|特别行政区|自治区|壮族|回族|维吾尔|地区)$/g, "");
    const lowerMap = {};
    for (const k in cityMap) lowerMap[k.toLowerCase()] = k;
    if (lowerMap[c]) return lowerMap[c];
    if (lowerMap[stripped]) return lowerMap[stripped];
    return null;
}

// 输入联想：根据子串匹配城市名 / 别名
function buildSuggestions(q) {
    const query = (q || "").trim().toLowerCase();
    if (!query) return [];
    const seen = new Set();
    const res = [];
    for (const c of Object.keys(cityMap)) {
        if (c.toLowerCase().includes(query)) {
            if (!seen.has(c)) { seen.add(c); res.push(c); }
        }
    }
    for (const a in cityAlias) {
        if (a.toLowerCase().includes(query)) {
            const c = cityAlias[a];
            if (!seen.has(c)) { seen.add(c); res.push(c); }
        }
    }
    return res.slice(0, 8);
}

// 渲染联想下拉
let activeIndex = -1;
function renderSuggestions(list) {
    suggestionsEl.innerHTML = "";
    if (!list.length) {
        suggestionsEl.classList.remove("show");
        return;
    }
    list.forEach((city, i) => {
        const div = document.createElement("div");
        div.className = "sug-item" + (i === activeIndex ? " active" : "");
        div.dataset.city = city;
        div.textContent = city + "（" + cityMap[city] + "）";
        div.onmousedown = (e) => { e.preventDefault(); chooseSuggestion(city); };
        suggestionsEl.appendChild(div);
    });
    suggestionsEl.classList.add("show");
}
function closeSuggestions() {
    suggestionsEl.classList.remove("show");
    activeIndex = -1;
}
function chooseSuggestion(city) {
    cityInput.value = city;
    closeSuggestions();
    doSearch();
}

// 历史记录（localStorage 记忆）
function loadHistory() {
    try { return JSON.parse(localStorage.getItem("cityHistory") || "[]"); }
    catch (e) { return []; }
}
function saveHistory(city) {
    let h = loadHistory().filter(x => x !== city);
    h.unshift(city);
    h = h.slice(0, 8);
    localStorage.setItem("cityHistory", JSON.stringify(h));
    renderHistory();
}
function renderHistory() {
    const h = loadHistory();
    if (!h.length) { historyEl.innerHTML = ""; return; }
    historyEl.innerHTML = '<div class="history-title">最近查询</div>';
    h.forEach(city => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = city;
        chip.onclick = () => { cityInput.value = city; doSearch(); };
        historyEl.appendChild(chip);
    });
}

// 执行查询
function doSearch() {
    const raw = cityInput.value.trim();
    if (!raw) {
        result.innerHTML = "请输入城市名称";
        result.style.color = "#f44336";
        return;
    }
    const city = normalizeCity(raw);
    if (!city) {
        result.innerHTML = `未查询到「${raw}」，试试输入地级市 / 县级市名称`;
        result.style.color = "#f44336";
        return;
    }
    const province = cityMap[city];
    const link = directCityLinks[city] || provinceLinks[province] || '#';
    const mark = directCityLinks[city] ? "（计划单列市 · 独立入口）" : "";
    result.innerHTML = `${city} → ${province} ${mark}<a href="${link}" target="_blank">【税务局官方查询】</a>`;
    result.style.color = "var(--theme-color)";
    saveHistory(city);
}

// 输入框交互：联想 + 键盘导航
cityInput.addEventListener("input", () => {
    activeIndex = -1;
    renderSuggestions(buildSuggestions(cityInput.value));
});
cityInput.addEventListener("keydown", (e) => {
    const items = suggestionsEl.querySelectorAll(".sug-item");
    if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!items.length) return;
        activeIndex = (activeIndex + 1) % items.length;
        renderSuggestions(buildSuggestions(cityInput.value));
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (!items.length) return;
        activeIndex = (activeIndex - 1 + items.length) % items.length;
        renderSuggestions(buildSuggestions(cityInput.value));
    } else if (e.key === "Enter") {
        if (activeIndex >= 0 && items[activeIndex]) {
            chooseSuggestion(items[activeIndex].dataset.city);
        } else {
            closeSuggestions();
            doSearch();
        }
    } else if (e.key === "Escape") {
        closeSuggestions();
    }
});
document.addEventListener("click", (e) => {
    if (!e.target.closest(".input-wrap")) closeSuggestions();
});

searchBtn.onclick = () => { closeSuggestions(); doSearch(); };

// 启动：渲染历史 + 校验数据完整性（漏配入口会在控制台告警）
renderHistory();
(function validateData() {
    const missing = [];
    for (const city in cityMap) {
        const p = cityMap[city];
        if (!provinceLinks[p] && !directCityLinks[city]) missing.push(city + " → " + p);
    }
    if (missing.length) console.warn("以下城市缺少对应查询入口：", missing);
})();
</script>
